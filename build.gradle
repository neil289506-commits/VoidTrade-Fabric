plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.17.17' // Best available reference point found (July 2026); VERIFY at https://fabricmc.net/develop before building
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories here if you need them:
	// https://docs.gradle.org/current/userguide/declaring_repositories.html
}

loom {
	// Use official Mojang mappings so class/method names match the
	// vanilla research (Merchant, MerchantMenu, AbstractVillager, Player)
	// used to identify the MC-50614 diff.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
